    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tells the browser this page has its own deliberate light design —
         without this, some Android browsers (Chrome's "Auto Dark Theme",
         Samsung Internet, MIUI/HyperOS browsers) apply their own automatic
         recoloring heuristic on top of ours when the phone's system theme
         is set to dark, which can make the page look broken/inconsistent
         rather than just "light". This makes the app render identically
         regardless of the phone's system theme setting. -->
    <meta name="color-scheme" content="light" />
    <title>SalonQueue - Smart Salon Management</title>
    <!-- Add this script to fix the SockJS global error -->
    <script>
      window.global = window;
    </script>
  </head>

  </body>
