# ?? No-Show Scheduler Configuration ?????????????????????????????????????????
#
# How long (minutes) a customer can sit at position 1 with no service started
# before being automatically marked as NO_SHOW.
# Increase this if your customers tend to arrive late, decrease for stricter queues.
queue.noshow.timeout-minutes=15

# How often the scheduler checks for stale entries, in milliseconds.
# 120000ms = every 2 minutes.
# You can lower this to 60000 (1 min) for more responsiveness,
# or raise to 300000 (5 min) to reduce DB load.
queue.noshow.check-interval-ms=60000
# ?????????????????????????????????????????????????????????????????????????????


# ── Payment Cleanup Scheduler Configuration ─────────────────────────────────
#
# How long (minutes) a booking can sit in PENDING_PAYMENT (customer started
# checkout but never completed it — closed the Razorpay popup, lost signal,
# silent failure with no webhook) before being auto-cancelled with reason
# PAYMENT_TIMEOUT. Keeps abandoned bookings from piling up forever.
payment.pending-timeout-minutes=20

# How often the scheduler checks for stale PENDING_PAYMENT bookings, in ms.
# 300000ms = every 5 minutes.
payment.cleanup-interval-ms=300000
# ─────────────────────────────────────────────────────────────────────────────

