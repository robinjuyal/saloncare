# JWT Configuration
jwt.secret=a993670cbfac2cba96aada1f206a12076eb311c1f3f5ff4459d9d422a5f328b4
# 30 days in milliseconds. Was 24 hours — too short for a consumer app people
# don't open daily, and was the direct cause of the "loading failed" /
# forced-logout issue. 30 days is a common middle ground for a JWT setup
# with no revocation mechanism: long enough that most people rarely see a
# forced logout, short enough to bound how long a leaked token stays valid.
# If you want stronger security later without the daily-login friction, the
# real upgrade path is a short-lived access token + separate long-lived
# refresh token — more work to build, worth doing once real user volume
# justifies it.
jwt.expiration=2592000000

